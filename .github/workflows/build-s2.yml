name: Build RK3288 kernel + resource

on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/**'
      - 'release-build/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Restore symlinks (zip-download safety net)
        run: |
          if [ -f scripts/restore-symlinks.py ]; then
            python3 scripts/restore-symlinks.py || true
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex lz4 libssl-dev python3 zip unzip \
            device-tree-compiler e2fsprogs xz-utils curl file \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          echo "--- toolchain ---"
          arm-linux-gnueabi-gcc --version | head -1

      - name: Build kernel (zImage + DTS)
        env:
          ARCH: arm
          CROSS_COMPILE: arm-linux-gnueabi-
          KCFLAGS: -Wno-array-compare
        run: |
          set -euo pipefail
          CFG=gsi-release
          O="$PWD/out/kernel-$CFG"
          mkdir -p "$O"
          cp "kernel-configs/$CFG.config" "$O/.config"
          make -C kernel O="$O" olddefconfig
          DTBS="rk3288-ifive-mini4s.dtb"
          if [ -f kernel/arch/arm/boot/dts/rk3288-bbk-s2.dts ]; then
            DTBS="$DTBS rk3288-bbk-s2.dtb"
            echo "::notice::检测到 rk3288-bbk-s2.dts，一起编译"
          fi
          make -C kernel O="$O" -j"$(nproc)" CC="${CROSS_COMPILE}gcc" zImage $DTBS
          echo "--- 产物 ---"
          ls -lh "$O/arch/arm/boot/zImage"
          ls -lh "$O/arch/arm/boot/dts/"*.dtb

      - name: Pack kernel.img (Rockchip KRNL)
        run: |
          set -euo pipefail
          O="$PWD/out/kernel-gsi-release"
          python3 release-build/tools/mkkrnl.py pack \
            "$O/arch/arm/boot/zImage" "$O/kernel.img"
          python3 release-build/tools/mkkrnl.py verify "$O/kernel.img"
          ls -lh "$O/kernel.img"

      - name: Build resource.img (iFive reference)
        run: |
          set -euo pipefail
          chmod +x release-build/tools/resource_tool release-build/tools/dtc || true
          ./release-build/build-resource.sh
          ls -lh release-build/resource-release-gsi.img

      - name: Build BBK S2 resource.img from our own DTB
        run: |
          set -euo pipefail
          W=$(mktemp -d)
          # 从现有 resource 里取开机 logo（纯装饰，先用 iFive 的）
          release-build/tools/resource_tool --unpack \
            --image=release-build/resource-release-gsi.img "$W/old" >/dev/null
          ls -l "$W/old"
          DTB=out/kernel-gsi-release/arch/arm/boot/dts/rk3288-bbk-s2.dtb
          if [ ! -f "$DTB" ]; then
            echo "::warning::没有 rk3288-bbk-s2.dtb，跳过 S2 resource 打包"
            exit 0
          fi
          release-build/tools/resource_tool --pack \
            --image="$W/res-bbk-s2.img" "$DTB" \
            "$W/old/logo.bmp" "$W/old/logo_kernel.bmp" >/dev/null
          # RK 要求 resource 分区为 16 MiB
          truncate -s 16777216 "$W/res-bbk-s2.img"
          cp "$W/res-bbk-s2.img" resource-bbk-s2.img
          echo "--- 校验 RSCE 魔数 ---"
          xxd -p -l 4 resource-bbk-s2.img
          echo "--- 反解确认里面是我们的 DTB ---"
          release-build/tools/resource_tool --unpack --image=resource-bbk-s2.img "$W/check" >/dev/null
          release-build/tools/dtc -I dtb -O dts "$W/check/rk-kernel.dtb" 2>/dev/null \
            | grep -m3 -E 'model|compatible' || true
          ls -lh resource-bbk-s2.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rk3288-build-${{ github.run_number }}
          path: |
            out/kernel-gsi-release/kernel.img
            out/kernel-gsi-release/arch/arm/boot/dts/*.dtb
            release-build/resource-release-gsi.img
            resource-bbk-s2.img
          if-no-files-found: error
          retention-days: 30
